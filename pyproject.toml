[project]
name = "procurepilot-ai"
version = "0.1.0"
description = "Evidence-first multi-agent procurement research"
requires-python = ">=3.12,<3.14"
dependencies = ["crewai==1.15.44", "pydantic>=2.11,<3", "streamlit>=1.45,<2", "plotly>=6,<7", "jinja2>=3.1,<4", "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5"]
[project.optional-dependencies]
scrapegraph = ["scrapegraphai==2.3.1"]
test = ["pytest>=8,<9"]
[tool.pytest.ini_options]
pythonpath = ["."]
